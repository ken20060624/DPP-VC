<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手持電風扇 DPP 數位產品護照</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; max-width: 420px; width: 100%; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); box-sizing: border-box; }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin-bottom: 12px; }
    .valid { background: #e6f4ea; color: #137333; }
    .invalid { background: #fce8e6; color: #c5221f; }
    h2 { margin: 0 0 8px 0; font-size: 1.4rem; color: #202124; }
    .field { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f3f4; padding: 10px 0; font-size: 0.95rem; }
    .label { color: #5f6368; }
    .val { font-weight: 500; color: #202124; }
  </style>
</head>
<body>
  <div class="card">
    <div id="statusBadge" class="badge">讀取中...</div>
    <h2 id="productName">手持渦輪風扇</h2>
    <p id="desc" style="color:#5f6368; font-size:0.9rem; margin-top:0;"></p>

    <div class="field"><span class="label">產品條碼 (GTIN)</span><span id="gtin" class="val">-</span></div>
    <div class="field"><span class="label">產品序號 (Serial)</span><span id="serial" class="val">-</span></div>
    <div class="field"><span class="label">電池容量</span><span class="val">2500 mAh (Li-ion)</span></div>
    <div class="field"><span class="label">碳足跡 (PCF)</span><span class="val">2.45 kg CO₂e</span></div>
    <div class="field"><span class="label">VC 簽發機構</span><span class="val">SGS Taiwan / 原廠</span></div>
  </div>

  <script>
    const path = window.location.pathname.split('/');
    // 解析 GS1 Digital Link: /01/{gtin}/21/{serial}
    // 優先從網址參數抓取 (?gtin=...&serial=...)
const urlParams = new URLSearchParams(window.location.search);
let gtin = urlParams.get('gtin');
let serial = urlParams.get('serial');

// 若沒有參數，則嘗試從 GS1 路徑抓取 (/01/{gtin}/21/{serial})
if (!serial) {
  const path = window.location.pathname.split('/');
  const gtinIndex = path.indexOf('01');
  const serialIndex = path.indexOf('21');
  gtin = gtinIndex !== -1 ? path[gtinIndex + 1] : "047199990001";
  serial = serialIndex !== -1 ? path[serialIndex + 1] : "FAN-2026-001";
}

    document.getElementById("gtin").innerText = gtin;
    document.getElementById("serial").innerText = serial;

    const isInvalid = serial.includes("002");
    const badge = document.getElementById("statusBadge");
    const desc = document.getElementById("desc");

    if (isInvalid) {
      badge.className = "badge invalid";
      badge.innerText = "❌ VC 憑證無效 / 遭竄改";
      desc.innerText = "此產品的數位憑證已被撤銷或碳足跡數據與發行者簽章不符。";
    } else {
      badge.className = "badge valid";
      badge.innerText = "✅ VC 密碼學驗證通過";
      desc.innerText = "本產品通過歐盟新電池法規合規標準與第三方碳足跡查證。";
    }
  </script>
</body>
</html>
